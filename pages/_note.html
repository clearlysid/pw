<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ title }}</title>
        <meta name="description" content="{{ description }}" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="preload" href="/fonts/source-serif-4-roman.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="/styles/main.css?v=45" />
    </head>
    <body>
        <header class="site-header site-column">
            <nav class="site-nav" aria-label="Primary navigation">
                <div class="site-nav-links">
                    <span class="site-nav-highlight" aria-hidden="true"></span>
                    <a href="/">~ SID</a>
                    <a class="is-active" href="/notes/" aria-current="page">NOTES</a>
                    <a href="/photos/">PHOTOS</a>
                </div>
            </nav>
        </header>
        <div id="swup" class="transition-page">
            {{{ coverImageHTML }}}
            <article class="note site-column">
                <div class="note-hero">
                    <header>
                        <h1 class="note-title"><span class="note-title-text">{{ title }}</span></h1>
                        <p class="note-date" data-page-reveal="1">{{ date }}</p>
                    </header>
                </div>
                <div class="note-content" data-page-reveal="2">{{{ content }}}</div>
            </article>
        </div>

        <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
        <script type="module" src="/js/main.js?v=9"></script>
    </body>
</html>
